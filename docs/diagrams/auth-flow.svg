<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <linearGradient id="auth-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5121B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC143C" />
    </marker>
  </defs>
  
  <rect width="1000" height="520" fill="#0D0D0D" />
  
  <text x="500" y="38" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">Authentication Flow</text>
  
  <!-- User -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="260" height="100" fill="url(#auth-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <circle cx="40" cy="40" r="24" fill="url(#red-grad)" />
    <text x="40" y="45" font-family="'Segoe UI', sans-serif" font-size="14" fill="#0D0D0D" text-anchor="middle">👤</text>
    <text x="80" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">User</text>
    <text x="80" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Admin / Teacher / Student</text>
    <text x="80" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Email + Password</text>
  </g>
  
  <!-- Login -->
  <g transform="translate(370, 100)">
    <rect x="0" y="0" width="260" height="100" fill="url(#auth-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="260" height="6" fill="url(#red-grad)" rx="3" />
    <text x="20" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">POST /api/v1/auth/login/</text>
    <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Validates credentials</text>
    <text x="20" y="76" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Access + Refresh tokens</text>
  </g>
  
  <!-- Storage -->
  <g transform="translate(680, 100)">
    <rect x="0" y="0" width="260" height="100" fill="url(#auth-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="260" height="6" fill="url(#red-grad)" rx="3" />
    <text x="20" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Token Storage</text>
    <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">SharedPreferences / localStorage</text>
    <text x="20" y="76" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Secure local storage</text>
  </g>
  
  <!-- Protected API -->
  <g transform="translate(370, 250)">
    <rect x="0" y="0" width="260" height="120" fill="url(#auth-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="260" height="6" fill="url(#red-grad)" rx="3" />
    <text x="20" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Protected API</text>
    <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Authorization: Bearer token</text>
    <text x="20" y="76" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">JWT validated each request</text>
    <text x="20" y="96" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Role-based access (RBAC)</text>
  </g>
  
  <!-- Refresh -->
  <g transform="translate(60, 250)">
    <rect x="0" y="0" width="260" height="100" fill="url(#auth-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="260" height="6" fill="url(#red-grad)" rx="3" />
    <text x="20" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Token Refresh</text>
    <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">POST /api/v1/auth/token/refresh/</text>
    <text x="20" y="76" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Access: 1h • Refresh: 7d</text>
  </g>
  
  <!-- Logout -->
  <g transform="translate(680, 250)">
    <rect x="0" y="0" width="260" height="80" fill="url(#auth-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="260" height="6" fill="url(#red-grad)" rx="3" />
    <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Logout</text>
    <text x="20" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Clear stored tokens</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0">Redirect to login</text>
  </g>
  
  <!-- Arrows -->
  <path d="M320 150 Q345 150 355 150" fill="none" stroke="#DC143C" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.9" />
  <path d="M630 150 Q655 150 665 150" fill="none" stroke="#DC143C" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.9" />
  <path d="M490 200 Q490 230 490 240" fill="none" stroke="#DC143C" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.9" />
  <path d="M370 310 Q345 280 335 250" fill="none" stroke="#DC143C" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.9" />
  <path d="M630 200 Q655 230 665 250" fill="none" stroke="#DC143C" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.9" />
  
  <!-- Security -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="880" height="80" fill="#B5121B" opacity="0.95" rx="8" filter="url(#shadow)" />
    <text x="20" y="32" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">🔐 JWT AUTHENTICATION</text>
    <text x="20" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">Access: 1 hour • Refresh: 7 days • Rotate on refresh • Role-based permissions</text>
  </g>
</svg>
