<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <linearGradient id="auth-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1D2B45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A192F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F7DB8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4FF" />
    </marker>
  </defs>
  
  <text x="500" y="35" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Authentication Flow</text>
  
  <!-- User -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="260" height="100" fill="url(#auth-grad)" rx="12" filter="url(#shadow)" />
    <circle cx="40" cy="40" r="25" fill="url(#accent-grad)" />
    <text x="40" y="45" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A192F" text-anchor="middle">👤</text>
    <text x="80" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">User</text>
    <text x="80" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Admin / Teacher / Student</text>
    <text x="80" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Enters email + password</text>
  </g>
  
  <!-- Login -->
  <g transform="translate(370, 90)">
    <rect x="0" y="0" width="260" height="100" fill="url(#auth-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="6" fill="url(#accent-grad)" rx="3" />
    <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">POST /api/v1/auth/login/</text>
    <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Validates credentials</text>
    <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Returns access + refresh tokens</text>
  </g>
  
  <!-- Token storage -->
  <g transform="translate(680, 90)">
    <rect x="0" y="0" width="260" height="100" fill="url(#auth-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="6" fill="url(#accent-grad)" rx="3" />
    <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SharedPreferences</text>
    <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Secure local storage</text>
    <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">(mobile) / localStorage (web)</text>
  </g>
  
  <!-- Protected API -->
  <g transform="translate(370, 240)">
    <rect x="0" y="0" width="260" height="120" fill="url(#auth-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="6" fill="url(#accent-grad)" rx="3" />
    <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Protected API Calls</text>
    <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Authorization: Bearer <access_token></text>
    <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">JWT validated on every request</text>
    <text x="20" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Role-based access (RBAC)</text>
  </g>
  
  <!-- Refresh -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="260" height="100" fill="url(#auth-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="6" fill="url(#accent-grad)" rx="3" />
    <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Token Refresh</text>
    <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">POST /api/v1/auth/token/refresh/</text>
    <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Access: 1h • Refresh: 7d</text>
  </g>
  
  <!-- Logout -->
  <g transform="translate(680, 240)">
    <rect x="0" y="0" width="260" height="80" fill="url(#auth-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="6" fill="url(#accent-grad)" rx="3" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Logout</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Clear stored tokens</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Redirect to login</text>
  </g>
  
  <!-- Arrows -->
  <path d="M320 140 Q345 140 355 140" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M630 140 Q655 140 665 140" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M490 190 Q490 220 490 230" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M370 300 Q345 270 335 240" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M630 190 Q655 220 665 240" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  
  <!-- Security -->
  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="880" height="70" fill="#10B981" opacity="0.9" rx="8" filter="url(#shadow)" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🔐 JWT Authentication</text>
    <text x="20" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E8F5E9">Access Token: 1 hour • Refresh Token: 7 days • Rotate on refresh • Role-based permissions</text>
  </g>
</svg>
