<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1D2B45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A192F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F7DB8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4FF" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">AttendQR — System Architecture</text>
  
  <!-- Client Layer -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="340" height="200" fill="url(#card-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="340" height="8" fill="url(#accent-grad)" rx="4" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">📱 Client Applications</text>
    <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Flutter Mobile App (Android/iOS)</text>
    <text x="20" y="85" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Web Admin Dashboard (Django Templates)</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Web Teacher &amp; Student Portals</text>
    <text x="20" y="140" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">QR Scanner &amp; Attendance Validation</text>
    <text x="20" y="170" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Roles: Admin • Teacher • Student</text>
  </g>
  
  <!-- API Layer -->
  <g transform="translate(430, 90)">
    <rect x="0" y="0" width="340" height="200" fill="url(#card-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="340" height="8" fill="url(#accent-grad)" rx="4" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">🔌 API Layer (Django REST Framework)</text>
    <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">REST API /api/v1/</text>
    <text x="20" y="85" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">JWT Authentication (SimpleJWT)</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Rate Limiting &amp; CORS</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Swagger / ReDoc Documentation</text>
    <text x="20" y="160" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Serializers &amp; ViewSets</text>
  </g>
  
  <!-- Backend Layer -->
  <g transform="translate(820, 90)">
    <rect x="0" y="0" width="340" height="200" fill="url(#card-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="340" height="8" fill="url(#accent-grad)" rx="4" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">⚙️ Backend (Django + Daphne)</text>
    <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Django 6.0 + Daphne ASGI</text>
    <text x="20" y="85" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">WebSocket (Channels) — Live Sessions</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">QR Code Generation &amp; Validation</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Email (Brevo SMTP)</text>
    <text x="20" y="160" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Admin Dashboard Templates</text>
  </g>
  
  <!-- Data Layer -->
  <g transform="translate(430, 340)">
    <rect x="0" y="0" width="340" height="220" fill="url(#card-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="340" height="8" fill="url(#accent-grad)" rx="4" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">🗄️ Data Layer</text>
    <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">PostgreSQL (Neon)</text>
    <text x="20" y="85" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Users, Classes, Sessions, Attendance</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Redis (Channels — WebSocket)</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Media: QR Codes, Reports</text>
    <text x="20" y="160" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Migrations &amp; Models</text>
    <text x="20" y="190" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">SSL: sslmode=require</text>
  </g>
  
  <!-- Arrows -->
  <path d="M210 190 Q320 190 410 200" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M600 290 Q600 300 600 340" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M600 560 Q600 310 800 300" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  
  <!-- Legend -->
  <g transform="translate(900, 580)">
    <rect x="0" y="0" width="260" height="100" fill="#0A192F" rx="8" opacity="0.6" />
    <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Legend</text>
    <line x1="15" y1="40" x2="35" y2="40" stroke="#00D4FF" stroke-width="2" />
    <text x="45" y="44" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Data flow</text>
    <text x="140" y="44" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8899AA">HTTPS / WSS</text>
    <text x="15" y="65" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8899AA">Premium SaaS Architecture</text>
    <text x="15" y="85" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8899AA">AttendQR — 2026</text>
  </g>
</svg>
