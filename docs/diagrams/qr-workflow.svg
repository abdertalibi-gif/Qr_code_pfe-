<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="step-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1D2B45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A192F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F7DB8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4FF" />
    </marker>
  </defs>
  
  <text x="600" y="35" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">QR Code Attendance Workflow</text>
  
  <!-- Step 1: Teacher creates session -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="320" height="160" fill="url(#step-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="320" height="6" fill="url(#accent-grad)" rx="3" />
    <circle cx="30" cy="30" r="28" fill="url(#accent-grad)" />
    <text x="30" y="36" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">1</text>
    <text x="70" y="40" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Teacher creates session</text>
    <text x="70" y="65" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Selects class, module, date, time, location</text>
    <text x="70" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Server generates QR token (20 min expiry)</text>
    <rect x="70" y="115" width="180" height="34" rx="6" fill="#00D4FF" />
    <text x="160" y="136" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0A192F" text-anchor="middle">Generate QR Code</text>
  </g>
  
  <!-- Step 2: QR displayed -->
  <g transform="translate(440, 90)">
    <rect x="0" y="0" width="320" height="160" fill="url(#step-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="320" height="6" fill="url(#accent-grad)" rx="3" />
    <circle cx="30" cy="30" r="28" fill="url(#accent-grad)" />
    <text x="30" y="36" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">2</text>
    <text x="70" y="40" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">QR Code displayed</text>
    <text x="70" y="65" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Shown on teacher's screen or projected</text>
    <text x="70" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Contains session ID, expiry, signature</text>
    <rect x="90" y="115" width="140" height="140" fill="#FFFFFF" rx="4" />
    <text x="160" y="175" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0" text-anchor="middle">QR Code Image</text>
  </g>
  
  <!-- Step 3: Student scans -->
  <g transform="translate(820, 90)">
    <rect x="0" y="0" width="320" height="160" fill="url(#step-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="320" height="6" fill="url(#accent-grad)" rx="3" />
    <circle cx="30" cy="30" r="28" fill="url(#accent-grad)" />
    <text x="30" y="36" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">3</text>
    <text x="70" y="40" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Student scans QR</text>
    <text x="70" y="65" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Mobile app camera captures QR</text>
    <text x="70" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Geolocation + device fingerprint captured</text>
    <rect x="70" y="115" width="180" height="34" rx="6" fill="#00D4FF" />
    <text x="160" y="136" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0A192F" text-anchor="middle">Submit Attendance</text>
  </g>
  
  <!-- Step 4: Server validates -->
  <g transform="translate(60, 300)">
    <rect x="0" y="0" width="320" height="160" fill="url(#step-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="320" height="6" fill="url(#accent-grad)" rx="3" />
    <circle cx="30" cy="30" r="28" fill="url(#accent-grad)" />
    <text x="30" y="36" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">4</text>
    <text x="70" y="40" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Server validates attendance</text>
    <text x="70" y="65" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Checks token validity &amp; expiry</text>
    <text x="70" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Validates geofence (50m radius)</text>
    <text x="70" y="115" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Checks time window (session active)</text>
    <rect x="70" y="145" width="180" height="34" rx="6" fill="#00D4FF" />
    <text x="160" y="166" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0A192F" text-anchor="middle">Record Attendance</text>
  </g>
  
  <!-- Step 5: Confirmation -->
  <g transform="translate(440, 300)">
    <rect x="0" y="0" width="320" height="160" fill="url(#step-grad)" rx="12" filter="url(#shadow)" />
    <rect x="0" y="0" width="320" height="6" fill="url(#accent-grad)" rx="3" />
    <circle cx="30" cy="30" r="28" fill="#10B981" />
    <text x="30" y="36" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">5</text>
    <text x="70" y="40" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Confirmation &amp; Report</text>
    <text x="70" y="65" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Student receives success message</text>
    <text x="70" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Teacher sees real-time attendance stats</text>
    <text x="70" y="115" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Excel report available for admin</text>
    <rect x="70" y="145" width="180" height="34" rx="6" fill="#10B981" />
    <text x="160" y="166" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Attendance Recorded ✓</text>
  </g>
  
  <!-- Arrows -->
  <path d="M380 170 Q410 170 420 170" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M760 170 Q790 170 800 170" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M220 260 Q220 290 220 300" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  <path d="M380 380 Q410 380 420 380" fill="none" stroke="#00D4FF" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8" />
  
  <!-- Security badge -->
  <g transform="translate(820, 300)">
    <rect x="0" y="0" width="320" height="80" fill="#10B981" opacity="0.9" rx="8" filter="url(#shadow)" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🔒 Security layers</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E8F5E9">JWT token • Geofence 50m • Time window • Device fingerprint</text>
  </g>
</svg>
