<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <defs>
    <linearGradient id="step-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5121B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC143C" />
    </marker>
  </defs>
  
  <rect width="1400" height="650" fill="#0D0D0D" />
  
  <text x="700" y="38" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">QR Code Attendance Workflow</text>
  <text x="700" y="62" font-family="'Segoe UI', sans-serif" font-size="13" fill="#DC143C" font-weight="600" letter-spacing="1" text-anchor="middle">FROM SESSION CREATION TO PRESENCE VALIDATION</text>
  
  <!-- Step 1 -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="320" height="170" fill="url(#step-card)" rx="16" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="320" height="6" fill="url(#red-grad)" rx="4" />
    <circle cx="34" cy="34" r="26" fill="url(#red-grad)" />
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0D0D0D" text-anchor="middle">1</text>
    <text x="72" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Teacher creates session</text>
    <text x="72" y="70" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Selects class, module, date, time</text>
    <text x="72" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Server generates QR token</text>
    <rect x="72" y="115" width="180" height="38" rx="8" fill="url(#red-grad)" />
    <text x="162" y="138" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#0D0D0D" text-anchor="middle">Generate QR Code</text>
  </g>
  
  <!-- Step 2 -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="320" height="170" fill="url(#step-card)" rx="16" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="320" height="6" fill="url(#red-grad)" rx="4" />
    <circle cx="34" cy="34" r="26" fill="url(#red-grad)" />
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0D0D0D" text-anchor="middle">2</text>
    <text x="72" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">QR Code displayed</text>
    <text x="72" y="70" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Shown on teacher screen</text>
    <text x="72" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Contains session ID &amp; expiry</text>
    <rect x="100" y="115" width="120" height="120" fill="#FFFFFF" rx="4" />
    <text x="160" y="172" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">QR Code</text>
  </g>
  
  <!-- Step 3 -->
  <g transform="translate(800, 110)">
    <rect x="0" y="0" width="320" height="170" fill="url(#step-card)" rx="16" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="320" height="6" fill="url(#red-grad)" rx="4" />
    <circle cx="34" cy="34" r="26" fill="url(#red-grad)" />
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0D0D0D" text-anchor="middle">3</text>
    <text x="72" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Student scans QR</text>
    <text x="72" y="70" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Mobile camera captures QR</text>
    <text x="72" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Geolocation captured</text>
    <rect x="72" y="115" width="180" height="38" rx="8" fill="url(#red-grad)" />
    <text x="162" y="138" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#0D0D0D" text-anchor="middle">Submit Attendance</text>
  </g>
  
  <!-- Step 4 -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="320" height="170" fill="url(#step-card)" rx="16" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="320" height="6" fill="url(#red-grad)" rx="4" />
    <circle cx="34" cy="34" r="26" fill="url(#red-grad)" />
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0D0D0D" text-anchor="middle">4</text>
    <text x="72" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Server validates</text>
    <text x="72" y="70" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Token validity &amp; expiry</text>
    <text x="72" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Geofence 50m radius</text>
    <text x="72" y="110" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Time window check</text>
    <rect x="72" y="135" width="180" height="38" rx="8" fill="url(#red-grad)" />
    <text x="162" y="158" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#0D0D0D" text-anchor="middle">Record Attendance</text>
  </g>
  
  <!-- Step 5 -->
  <g transform="translate(430, 320)">
    <rect x="0" y="0" width="320" height="170" fill="url(#step-card)" rx="16" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="320" height="6" fill="url(#red-grad)" rx="4" />
    <circle cx="34" cy="34" r="26" fill="#B5121B" />
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0D0D0D" text-anchor="middle">5</text>
    <text x="72" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Confirmation</text>
    <text x="72" y="70" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Student receives success</text>
    <text x="72" y="90" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Teacher sees real-time</text>
    <text x="72" y="110" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0B0B0">Excel report available</text>
    <rect x="72" y="135" width="180" height="38" rx="8" fill="#B5121B" />
    <text x="162" y="158" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#0D0D0D" text-anchor="middle">Attendance Recorded</text>
  </g>
  
  <!-- Arrows -->
  <path d="M380 195 Q410 195 420 195" fill="none" stroke="#DC143C" stroke-width="2.5" marker-end="url(#arrowhead)" opacity="0.9" />
  <path d="M750 195 Q780 195 790 195" fill="none" stroke="#DC143C" stroke-width="2.5" marker-end="url(#arrowhead)" opacity="0.9" />
  <path d="M220 285 Q220 305 220 315" fill="none" stroke="#DC143C" stroke-width="2.5" marker-end="url(#arrowhead)" opacity="0.9" />
  <path d="M380 405 Q410 405 420 405" fill="none" stroke="#DC143C" stroke-width="2.5" marker-end="url(#arrowhead)" opacity="0.9" />
  
  <!-- Security -->
  <g transform="translate(800, 320)">
    <rect x="0" y="0" width="320" height="90" fill="#B5121B" rx="12" filter="url(#shadow)" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">🔒 SECURITY</text>
    <text x="20" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">JWT • Geofence 50m • Time Window • Device Fingerprint</text>
  </g>
</svg>
