<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="entity-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1D2B45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A192F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F7DB8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <text x="700" y="35" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Database Schema — AttendQR</text>
  
  <!-- Helper to draw entity -->
  <g id="entity-template">
    <!-- Will be used via references -->
  </g>
  
  <!-- User Entity -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="300" height="200" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="300" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="150" y="23" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">User</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">email</text>
    <text x="20" y="95" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">full_name</text>
    <text x="20" y="115" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">role</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">department_id (FK)</text>
    <text x="20" y="155" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">is_active</text>
    <text x="20" y="175" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">created_at</text>
  </g>
  
  <!-- Classe Entity -->
  <g transform="translate(420, 90)">
    <rect x="0" y="0" width="300" height="220" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="300" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="150" y="23" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">Classe</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">name</text>
    <text x="20" y="95" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">code</text>
    <text x="20" y="115" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">niveau</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">filiere_id (FK)</text>
    <text x="20" y="155" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">semestre_id (FK)</text>
    <text x="20" y="175" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">module_id (FK)</text>
    <text x="20" y="195" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">academic_year</text>
  </g>
  
  <!-- Session Entity -->
  <g transform="translate(780, 90)">
    <rect x="0" y="0" width="300" height="240" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="300" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="150" y="23" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">Session</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">subject</text>
    <text x="20" y="95" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">module_id (FK)</text>
    <text x="20" y="115" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">teacher_id (FK)</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">classe_id (FK)</text>
    <text x="20" y="155" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">location_type</text>
    <text x="20" y="175" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">block_id (FK)</text>
    <text x="20" y="195" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">room_id (FK)</text>
    <text x="20" y="215" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">amphitheater_id (FK)</text>
  </g>
  
  <!-- Session Details below Session -->
  <g transform="translate(780, 380)">
    <rect x="0" y="0" width="300" height="160" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="300" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="150" y="23" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">Session (cont.)</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">date</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">start_time</text>
    <text x="20" y="95" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">end_time</text>
    <text x="20" y="115" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">session_type</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">is_active</text>
    <text x="20" y="155" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">qr_token</text>
  </g>
  
  <!-- Filiere Entity -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="300" height="140" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="300" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="150" y="23" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">Filiere</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">name</text>
    <text x="20" y="95" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">semestre_id (FK)</text>
    <text x="20" y="115" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">department_id (FK)</text>
  </g>
  
  <!-- Semestre Entity -->
  <g transform="translate(420, 360)">
    <rect x="0" y="0" width="300" height="120" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="300" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="150" y="23" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">Semestre</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">name</text>
  </g>
  
  <!-- Module Entity -->
  <g transform="translate(780, 600)">
    <rect x="0" y="0" width="300" height="120" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="300" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="150" y="23" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0A192F" text-anchor="middle">Module</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">name</text>
    <text x="20" y="95" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">filiere_id (FK)</text>
  </g>
  
  <!-- Location Entities -->
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="140" height="120" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="140" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="70" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A192F" text-anchor="middle">Block</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">name</text>
  </g>
  
  <g transform="translate(220, 560)">
    <rect x="0" y="0" width="140" height="120" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="140" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="70" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A192F" text-anchor="middle">Room</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">name</text>
  </g>
  
  <g transform="translate(380, 560)">
    <rect x="0" y="0" width="160" height="120" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="160" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="80" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A192F" text-anchor="middle">Amphitheater</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">name</text>
  </g>
  
  <!-- Department Entity -->
  <g transform="translate(60, 740)">
    <rect x="0" y="0" width="200" height="100" fill="url(#entity-grad)" rx="12" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    <rect x="0" y="0" width="200" height="32" fill="url(#pk-grad)" rx="12 12 0 0" />
    <text x="100" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A192F" text-anchor="middle">Department</text>
    <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">id (PK)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">name</text>
  </g>
  
  <!-- Relationships -->
  <defs>
    <marker id="rel-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4FF" />
    </marker>
  </defs>
  
  <!-- User -> Classe (teacher) -->
  <path d="M210 190 Q300 190 400 200" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.6" />
  <text x="290" y="185" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8899AA">teaches</text>
  
  <!-- User -> Session -->
  <path d="M420 200 Q500 200 760 210" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.6" />
  <text x="570" y="195" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8899AA">teaches</text>
  
  <!-- Classe -> Session -->
  <path d="M570 200 Q650 200 760 220" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.6" />
  <text x="640" y="205" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8899AA">has sessions</text>
  
  <!-- Filiere -> Classe -->
  <path d="M210 310 Q290 310 410 320" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.6" />
  <text x="300" y="295" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8899AA">contains</text>
  
  <!-- Semestre -> Filiere -->
  <path d="M570 420 Q650 420 750 430" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.6" />
  <text x="590" y="405" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8899AA">has</text>
  
  <!-- Filiere -> Module -->
  <path d="M570 480 Q650 480 750 720" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.6" />
  <text x="620" y="600" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8899AA">has modules</text>
  
  <!-- Block/Room/Amphi -> Session -->
  <path d="M130 620 Q250 620 910 630" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.6" />
  <text x="500" y="605" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8899AA">location</text>
  
  <!-- Department -> User -->
  <path d="M160 840 Q200 840 210 290" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.6" />
  <text x="140" y="560" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8899AA">belongs to</text>
  
  <!-- Legend -->
  <g transform="translate(1050, 780)">
    <rect x="0" y="0" width="320" height="100" fill="#0A192F" rx="8" opacity="0.8" />
    <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Legend</text>
    <text x="15" y="45" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">(PK) Primary Key</text>
    <text x="15" y="65" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">(FK) Foreign Key</text>
    <line x1="15" y1="80" x2="35" y2="80" stroke="#00D4FF" stroke-width="1.5" />
    <text x="45" y="84" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Relationship</text>
    <text x="15" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8899AA">Based on Django models (users, courses, curriculum)</text>
  </g>
</svg>
