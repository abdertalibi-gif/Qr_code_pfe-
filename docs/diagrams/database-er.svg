<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
  <defs>
    <linearGradient id="entity-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5121B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="rel-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC143C" />
    </marker>
  </defs>
  
  <rect width="1400" height="950" fill="#0D0D0D" />
  
  <text x="700" y="38" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">Database Schema — AttendQR</text>
  <text x="700" y="62" font-family="'Segoe UI', sans-serif" font-size="13" fill="#DC143C" font-weight="600" letter-spacing="1" text-anchor="middle">BASED ON DJANGO MODELS</text>
  
  <!-- User -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="300" height="190" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="300" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="150" y="22" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#0D0D0D" text-anchor="middle">User</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">email</text>
    <text x="20" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">full_name</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">role</text>
    <text x="20" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">department_id (FK)</text>
    <text x="20" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">is_active</text>
    <text x="20" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">created_at</text>
  </g>
  
  <!-- Classe -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="300" height="220" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="300" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="150" y="22" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#0D0D0D" text-anchor="middle">Classe</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">name</text>
    <text x="20" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">code</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">niveau</text>
    <text x="20" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">filiere_id (FK)</text>
    <text x="20" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">semestre_id (FK)</text>
    <text x="20" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">module_id (FK)</text>
    <text x="20" y="190" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">academic_year</text>
  </g>
  
  <!-- Session -->
  <g transform="translate(780, 100)">
    <rect x="0" y="0" width="300" height="240" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="300" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="150" y="22" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#0D0D0D" text-anchor="middle">Session</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">subject</text>
    <text x="20" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">module_id (FK)</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">teacher_id (FK)</text>
    <text x="20" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">classe_id (FK)</text>
    <text x="20" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">location_type</text>
    <text x="20" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">block_id (FK)</text>
    <text x="20" y="190" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">room_id (FK)</text>
    <text x="20" y="210" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">amphitheater_id (FK)</text>
  </g>
  
  <!-- Session details -->
  <g transform="translate(780, 390)">
    <rect x="0" y="0" width="300" height="160" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="300" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="150" y="22" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#0D0D0D" text-anchor="middle">Session (cont.)</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">date</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">start_time</text>
    <text x="20" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">end_time</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">session_type</text>
    <text x="20" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">is_active</text>
    <text x="20" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">qr_token</text>
  </g>
  
  <!-- Filiere -->
  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="300" height="140" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="300" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="150" y="22" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#0D0D0D" text-anchor="middle">Filiere</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">name</text>
    <text x="20" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">semestre_id (FK)</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">department_id (FK)</text>
  </g>
  
  <!-- Semestre -->
  <g transform="translate(420, 370)">
    <rect x="0" y="0" width="300" height="120" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="300" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="150" y="22" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#0D0D0D" text-anchor="middle">Semestre</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">name</text>
  </g>
  
  <!-- Module -->
  <g transform="translate(780, 610)">
    <rect x="0" y="0" width="300" height="120" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="300" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="150" y="22" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#0D0D0D" text-anchor="middle">Module</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">name</text>
    <text x="20" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">filiere_id (FK)</text>
  </g>
  
  <!-- Block -->
  <g transform="translate(60, 570)">
    <rect x="0" y="0" width="140" height="120" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="140" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="70" y="22" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#0D0D0D" text-anchor="middle">Block</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E0E0E0">name</text>
  </g>
  
  <!-- Room -->
  <g transform="translate(220, 570)">
    <rect x="0" y="0" width="140" height="120" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="140" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="70" y="22" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#0D0D0D" text-anchor="middle">Room</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E0E0E0">name</text>
  </g>
  
  <!-- Amphitheater -->
  <g transform="translate(380, 570)">
    <rect x="0" y="0" width="160" height="120" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="160" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="80" y="22" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#0D0D0D" text-anchor="middle">Amphitheater</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E0E0E0">name</text>
  </g>
  
  <!-- Department -->
  <g transform="translate(60, 750)">
    <rect x="0" y="0" width="200" height="100" fill="url(#entity-card)" rx="12" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    <rect x="0" y="0" width="200" height="30" fill="url(#red-grad)" rx="12 12 0 0" />
    <text x="100" y="22" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#0D0D0D" text-anchor="middle">Department</text>
    <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E0E0E0">id (PK)</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E0E0E0">name</text>
  </g>
  
  <!-- Relationships -->
  <path d="M210 190 Q300 190 400 200" fill="none" stroke="#DC143C" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.8" />
  <text x="290" y="175" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">teaches</text>
  
  <path d="M420 210 Q500 210 760 220" fill="none" stroke="#DC143C" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.8" />
  <text x="570" y="205" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">teaches</text>
  
  <path d="M570 220 Q650 220 760 230" fill="none" stroke="#DC143C" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.8" />
  <text x="640" y="205" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">has sessions</text>
  
  <path d="M210 310 Q290 310 410 320" fill="none" stroke="#DC143C" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.8" />
  <text x="300" y="305" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">contains</text>
  
  <path d="M570 430 Q650 430 750 440" fill="none" stroke="#DC143C" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.8" />
  <text x="590" y="425" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">has</text>
  
  <path d="M570 490 Q650 490 750 730" fill="none" stroke="#DC143C" stroke-width="1.5" marker-end="url(#rel-arrow)" opacity="0.8" />
  <text x="620" y="610" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">has modules</text>
  
  <path d="M130 630 Q250 630 910 640" fill="none" stroke="#DC143C" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.8" />
  <text x="500" y="605" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">location</text>
  
  <path d="M160 850 Q200 850 210 300" fill="none" stroke="#DC143C" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.8" />
  <text x="140" y="560" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">belongs to</text>
  
  <!-- Legend -->
  <g transform="translate(1050, 830)">
    <rect x="0" y="0" width="320" height="100" fill="#1A1A1A" rx="8" stroke="#B5121B" stroke-width="1" opacity="0.9" />
    <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">LEGEND</text>
    <text x="15" y="45" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">(PK) Primary Key</text>
    <text x="15" y="65" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">(FK) Foreign Key</text>
    <line x1="15" y1="80" x2="35" y2="80" stroke="#DC143C" stroke-width="1.5" />
    <text x="45" y="84" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Relationship</text>
    <text x="15" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Django models · users, courses, curriculum</text>
  </g>
</svg>
