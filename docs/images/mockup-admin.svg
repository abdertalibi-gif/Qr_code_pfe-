<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141414;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5121B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1400" height="800" fill="url(#bg-grad)" />
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="800" fill="#0A0A0A" />
  <rect x="0" y="0" width="260" height="80" fill="#141414" />
  <text x="130" y="52" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">AttendQR</text>
  <text x="130" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#DC143C" text-anchor="middle" font-weight="800">ADMIN</text>
  
  <g transform="translate(20, 110)">
    <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#888888" text-transform="uppercase">Navigation</text>
    <rect x="0" y="30" width="220" height="48" fill="#DC143C" rx="12" />
    <text x="20" y="62" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#0D0D0D">📊 Dashboard</text>
    
    <rect x="0" y="90" width="220" height="48" fill="none" />
    <text x="20" y="122" font-family="'Segoe UI', sans-serif" font-size="13" fill="#888888">👥 Users</text>
    <rect x="0" y="150" width="220" height="48" fill="none" />
    <text x="20" y="182" font-family="'Segoe UI', sans-serif" font-size="13" fill="#888888">👨‍🏫 Teachers</text>
    <rect x="0" y="210" width="220" height="48" fill="none" />
    <text x="20" y="242" font-family="'Segoe UI', sans-serif" font-size="13" fill="#888888">🎓 Students</text>
    <rect x="0" y="270" width="220" height="48" fill="none" />
    <text x="20" y="302" font-family="'Segoe UI', sans-serif" font-size="13" fill="#888888">📅 Sessions</text>
    <rect x="0" y="330" width="220" height="48" fill="none" />
    <text x="20" y="362" font-family="'Segoe UI', sans-serif" font-size="13" fill="#888888">📊 Reports</text>
    <rect x="0" y="390" width="220" height="48" fill="none" />
    <text x="20" y="422" font-family="'Segoe UI', sans-serif" font-size="13" fill="#888888">⚙️ Settings</text>
  </g>
  
  <!-- Main -->
  <g transform="translate(280, 0)">
    <rect x="0" y="0" width="1120" height="800" fill="url(#bg-grad)" />
    
    <rect x="20" y="20" width="1080" height="70" fill="#0A0A0A" rx="16" stroke="#B5121B" stroke-width="1" />
    <text x="40" y="55" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Admin Dashboard</text>
    <text x="40" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#888888">Manage users, classes, sessions, and view live attendance.</text>
    
    <!-- Stats -->
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="250" height="130" fill="url(#card-grad)" rx="18" filter="url(#shadow)" stroke="#2A2A2A" stroke-width="1" />
      <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#DC143C">Users</text>
      <text x="20" y="62" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">126</text>
      <rect x="20" y="92" width="60" height="6" fill="#DC143C" rx="3" />
      
      <rect x="270" y="0" width="250" height="130" fill="url(#card-grad)" rx="18" filter="url(#shadow)" stroke="#2A2A2A" stroke-width="1" />
      <text x="290" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#DC143C">Classes</text>
      <text x="290" y="62" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">17</text>
      <rect x="290" y="92" width="60" height="6" fill="#B5121B" rx="3" />
      
      <rect x="540" y="0" width="250" height="130" fill="url(#card-grad)" rx="18" filter="url(#shadow)" stroke="#2A2A2A" stroke-width="1" />
      <text x="560" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#DC143C">Teachers</text>
      <text x="560" y="62" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">65</text>
      <rect x="560" y="92" width="60" height="6" fill="#FFFFFF" rx="3" />
      
      <rect x="810" y="0" width="250" height="130" fill="url(#card-grad)" rx="18" filter="url(#shadow)" stroke="#2A2A2A" stroke-width="1" />
      <text x="830" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#DC143C">Active Sessions</text>
      <text x="830" y="62" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">24</text>
      <rect x="830" y="92" width="60" height="6" fill="#FFFFFF" rx="3" />
    </g>
    
    <!-- Sessions Table -->
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="1080" height="480" fill="url(#card-grad)" rx="16" filter="url(#shadow)" stroke="#2A2A2A" stroke-width="1" />
      
      <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">All Sessions</text>
      <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Loading session count…</text>
      
      <g transform="translate(20, 80)">
        <rect x="0" y="0" width="1040" height="360" fill="#0A0A0A" rx="14" />
        <rect x="0" y="0" width="1040" height="44" fill="#141414" rx="14 14 0 0" />
        <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#888888">#</text>
        <text x="60" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#888888">Title</text>
        <text x="220" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#888888">Class</text>
        <text x="340" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#888888">Subject</text>
        <text x="460" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#888888">Teacher</text>
        <text x="580" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#888888">Room</text>
        <text x="700" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#888888">Status</text>
        
        <rect x="0" y="50" width="1040" height="44" fill="none" />
        <text x="20" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">1</text>
        <text x="60" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Mathematics S1</text>
        <text x="220" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">License S1</text>
        <text x="340" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Mathematics</text>
        <text x="460" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Dr. Martin</text>
        <text x="580" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Block 2 - Room 4</text>
        <rect x="700" y="62" width="80" height="22" fill="#DC143C" opacity="0.2" rx="11" />
        <text x="740" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#DC143C" font-weight="800" text-anchor="middle">Active</text>
        
        <rect x="0" y="100" width="1040" height="44" fill="#141414" rx="4" />
        <text x="20" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">2</text>
        <text x="60" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Physics S2</text>
        <text x="220" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">License S2</text>
        <text x="340" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Physics</text>
        <text x="460" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Ms. Dubois</text>
        <text x="580" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Amphitheater A</text>
        <rect x="700" y="112" width="80" height="22" fill="#FFFFFF" opacity="0.2" rx="11" />
        <text x="740" y="128" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FFFFFF" font-weight="800" text-anchor="middle">Pending</text>
        
        <rect x="0" y="150" width="1040" height="44" fill="none" />
        <text x="20" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">3</text>
        <text x="60" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Computer Science S3</text>
        <text x="220" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">License S3</text>
        <text x="340" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Web Programming</text>
        <text x="460" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Dr. Bernard</text>
        <text x="580" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0">Block 3 - Room 2</text>
        <rect x="700" y="162" width="80" height="22" fill="#888888" opacity="0.2" rx="11" />
        <text x="740" y="178" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888" font-weight="800" text-anchor="middle">Closed</text>
      </g>
    </g>
    
    <text x="20" y="780" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666666">AttendQR — Smart QR Attendance Management</text>
  </g>
</svg>
