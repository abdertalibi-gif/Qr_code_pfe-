<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050A14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16253A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1E30;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F7DB8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1400" height="800" fill="url(#bg-grad)" />
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="800" fill="#050A14" />
  <rect x="0" y="0" width="260" height="80" fill="#16253A" />
  <text x="130" y="52" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">AttendQR</text>
  <text x="130" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00D4FF" text-anchor="middle" font-weight="600">ADMIN</text>
  
  <g transform="translate(20, 110)">
    <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8899AA" text-transform="uppercase">Navigation</text>
    <rect x="0" y="30" width="220" height="48" fill="#00D4FF" rx="10" />
    <text x="20" y="62" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A192F">📊 Tableau de bord</text>
    
    <rect x="0" y="90" width="220" height="48" fill="none" />
    <text x="20" y="122" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8899AA">👥 Utilisateurs</text>
    <rect x="0" y="150" width="220" height="48" fill="none" />
    <text x="20" y="182" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8899AA">👨‍🏫 Enseignants</text>
    <rect x="0" y="210" width="220" height="48" fill="none" />
    <text x="20" y="242" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8899AA">🎓 Étudiants</text>
    <rect x="0" y="270" width="220" height="48" fill="none" />
    <text x="20" y="302" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8899AA">📅 Séances</text>
    <rect x="0" y="330" width="220" height="48" fill="none" />
    <text x="20" y="362" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8899AA">📊 Rapports</text>
    <rect x="0" y="390" width="220" height="48" fill="none" />
    <text x="20" y="422" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8899AA">⚙️ Paramètres</text>
  </g>
  
  <!-- Main Content -->
  <g transform="translate(280, 0)">
    <rect x="0" y="0" width="1120" height="800" fill="url(#bg-grad)" />
    
    <!-- Header -->
    <rect x="20" y="20" width="1080" height="70" fill="#050A14" rx="12" stroke="#1E3A5A" stroke-width="1" />
    <text x="40" y="55" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Tableau de bord administrateur</text>
    <text x="40" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8899AA">Gérez les utilisateurs, classes, séances et consultez les présences en direct.</text>
    
    <!-- Stats Cards -->
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="250" height="130" fill="url(#card-grad)" rx="16" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
      <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8899AA">Utilisateurs</text>
      <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">126</text>
      <rect x="20" y="90" width="60" height="6" fill="#00D4FF" rx="3" />
      
      <rect x="270" y="0" width="250" height="130" fill="url(#card-grad)" rx="16" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
      <text x="290" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8899AA">Classes</text>
      <text x="290" y="60" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">17</text>
      <rect x="290" y="90" width="60" height="6" fill="#0F7DB8" rx="3" />
      
      <rect x="540" y="0" width="250" height="130" fill="url(#card-grad)" rx="16" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
      <text x="560" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8899AA">Enseignants</text>
      <text x="560" y="60" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">65</text>
      <rect x="560" y="90" width="60" height="6" fill="#10B981" rx="3" />
      
      <rect x="810" y="0" width="250" height="130" fill="url(#card-grad)" rx="16" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
      <text x="830" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8899AA">Séances actives</text>
      <text x="830" y="60" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">24</text>
      <rect x="830" y="90" width="60" height="6" fill="#F28C28" rx="3" />
    </g>
    
    <!-- Sessions Table -->
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="1080" height="480" fill="url(#card-grad)" rx="16" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
      
      <!-- Table Header -->
      <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Toutes les séances</text>
      <text x="20" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8899AA">Chargement du nombre de séances…</text>
      
      <!-- Table -->
      <g transform="translate(20, 80)">
        <rect x="0" y="0" width="1040" height="360" fill="#050A14" rx="12" />
        <!-- Header row -->
        <rect x="0" y="0" width="1040" height="44" fill="#16253A" rx="12 12 0 0" />
        <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8899AA">#</text>
        <text x="60" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8899AA">Titre</text>
        <text x="220" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8899AA">Classe</text>
        <text x="340" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8899AA">Matière</text>
        <text x="460" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8899AA">Enseignant</text>
        <text x="580" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8899AA">Salle</text>
        <text x="700" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8899AA">Statut</text>
        
        <!-- Row 1 -->
        <rect x="0" y="50" width="1040" height="44" fill="none" />
        <text x="20" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">1</text>
        <text x="60" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Mathématiques S1</text>
        <text x="220" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Licence S1</text>
        <text x="340" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Mathématiques</text>
        <text x="460" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Dr. Martin</text>
        <text x="580" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Bloc 2 - Salle 4</text>
        <rect x="700" y="62" width="80" height="22" fill="#10B981" opacity="0.2" rx="11" />
        <text x="740" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#10B981" font-weight="600" text-anchor="middle">Active</text>
        
        <!-- Row 2 -->
        <rect x="0" y="100" width="1040" height="44" fill="#0A1220" rx="4" />
        <text x="20" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">2</text>
        <text x="60" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Physique S2</text>
        <text x="220" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Licence S2</text>
        <text x="340" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Physique</text>
        <text x="460" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Mme. Dubois</text>
        <text x="580" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Amphithéâtre A</text>
        <rect x="700" y="112" width="80" height="22" fill="#F28C28" opacity="0.2" rx="11" />
        <text x="740" y="128" font-family="'Segoe UI', sans-serif" font-size="11" fill="#F28C28" font-weight="600" text-anchor="middle">Pending</text>
        
        <!-- Row 3 -->
        <rect x="0" y="150" width="1040" height="44" fill="none" />
        <text x="20" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">3</text>
        <text x="60" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Informatique S3</text>
        <text x="220" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Licence S3</text>
        <text x="340" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Programmation Web</text>
        <text x="460" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Dr. Bernard</text>
        <text x="580" y="178" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0">Bloc 3 - Salle 2</text>
        <rect x="700" y="162" width="80" height="22" fill="#EF4444" opacity="0.2" rx="11" />
        <text x="740" y="178" font-family="'Segoe UI', sans-serif" font-size="11" fill="#EF4444" font-weight="600" text-anchor="middle">Closed</text>
      </g>
    </g>
    
    <!-- Footer -->
    <text x="20" y="780" font-family="'Segoe UI', sans-serif" font-size="11" fill="#667788">AttendQR — Smart QR Attendance Management</text>
  </g>
</svg>
