<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050A14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16253A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1E30;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F7DB8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1400" height="800" fill="url(#bg-grad)" />
  
  <!-- Two mobile frames side by side -->
  <!-- Mobile 1: Student Dashboard -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="360" height="680" fill="#0A192F" rx="36" />
    <rect x="0" y="0" width="360" height="50" fill="#050A14" rx="36 36 0 0" />
    <rect x="150" y="8" width="60" height="8" fill="#FFFFFF" rx="4" />
    
    <rect x="20" y="70" width="320" height="60" fill="#16253A" rx="16" stroke="#1E3A5A" stroke-width="1" />
    <text x="40" y="105" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Mon emploi du temps</text>
    
    <!-- Semester groups -->
    <text x="40" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#00D4FF">S2 · Culture digitale</text>
    <rect x="40" y="170" width="150" height="80" fill="#16253A" rx="12" stroke="#1E3A5A" stroke-width="1" />
    <text x="55" y="210" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Culture digitale</text>
    <text x="55" y="228" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00D4FF" text-anchor="middle">Séance suivante · 14:00</text>
    
    <text x="210" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#00D4FF">S3 · Programmation Web 1</text>
    <rect x="210" y="170" width="150" height="80" fill="#16253A" rx="12" stroke="#1E3A5A" stroke-width="1" />
    <text x="225" y="210" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Programmation Web 1</text>
    <text x="225" y="228" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00D4FF" text-anchor="middle">Séance suivante · 16:00</text>
    
    <!-- Upcoming sessions -->
    <text x="40" y="280" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Séances à venir</text>
    <rect x="40" y="295" width="280" height="60" fill="#050A14" rx="12" stroke="#2A4A6E" stroke-width="1" />
    <circle cx="70" cy="325" r="20" fill="#00D4FF" opacity="0.2" />
    <text x="70" y="331" font-family="'Segoe UI', sans-serif" font-size="16" fill="#00D4FF" text-anchor="middle">QR</text>
    <text x="100" y="315" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Mathématiques S1</text>
    <text x="100" y="335" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Dr. Martin • Bloc 2 - Salle 4 • 14:00-16:00</text>
    <rect x="250" y="310" width="50" height="24" fill="#10B981" rx="12" />
    <text x="275" y="326" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">Prêt</text>
    
    <!-- QR Scanner -->
    <rect x="40" y="380" width="280" height="220" fill="#16253A" rx="20" stroke="#1E3A5A" stroke-width="1" />
    <text x="60" y="410" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Scanner un QR Code</td>
    <rect x="60" y="430" width="240" height="240" fill="#050A14" rx="16" />
    <circle cx="180" cy="550" r="80" fill="#00D4FF" opacity="0.1" stroke="#00D4FF" stroke-width="2" />
    <circle cx="180" cy="550" r="40" fill="#00D4FF" opacity="0.3" />
    <path d="M180 510 L180 590 M140 550 L220 550" fill="none" stroke="#00D4FF" stroke-width="3" stroke-linecap="round" />
    <text x="180" y="640" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00D4FF" text-anchor="middle">Positionnez le QR Code dans le cadre</text>
    <rect x="60" y="660" width="240" height="50" fill="url(#accent-grad)" rx="12" />
    <text x="180" y="680" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A192F" text-anchor="middle">Scanner</text>
  </g>
  
  <!-- Mobile 2: Attendance Confirmed -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="360" height="680" fill="#0A192F" rx="36" />
    <rect x="0" y="0" width="360" height="50" fill="#050A14" rx="36 36 0 0" />
    <rect x="150" y="8" width="60" height="8" fill="#FFFFFF" rx="4" />
    
    <rect x="20" y="70" width="320" height="60" fill="#16253A" rx="16" stroke="#1E3A5A" stroke-width="1" />
    <text x="40" y="105" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Présence validée ✓</text>
    
    <rect x="40" y="150" width="280" height="180" fill="#10B981" opacity="0.1" rx="20" stroke="#10B981" stroke-width="1" />
    <circle cx="180" cy="200" r="50" fill="#10B981" opacity="0.2" />
    <text x="180" y="208" font-family="'Segoe UI', sans-serif" font-size="48" fill="#10B981" text-anchor="middle">✓</text>
    <text x="180" y="265" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#10B981" text-anchor="middle">Présence enregistrée</text>
    <text x="180" y="290" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0" text-anchor="middle">Mathématiques S1 • Dr. Martin</td>
    <text x="180" y="310" font-family="'Segoe UI', sans-serif" font-size="12" fill="#B0C0D0" text-anchor="middle">Bloc 2 - Salle 4 • 07 nov. 2026 • 14:15</text>
    
    <text x="40" y="360" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Détails de la séance</text>
    <rect x="40" y="375" width="280" height="60" fill="#050A14" rx="12" />
    <text x="60" y="397" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Lieu</text>
    <text x="60" y="415" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Bloc 2 – Salle 4</text>
    <rect x="40" y="445" width="280" height="60" fill="#050A14" rx="12" />
    <text x="60" y="467" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Type</text>
    <text x="60" y="485" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0C0D0">Cours</text>
    
    <rect x="40" y="520" width="280" height="56" fill="url(#accent-grad)" rx="14" />
    <text x="180" y="546" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A192F" text-anchor="middle">Retour à l'emploi du temps</text>
  </g>
  
  <!-- Info panel -->
  <g transform="translate(900, 60)">
    <rect x="0" y="0" width="440" height="680" fill="#050A14" rx="20" filter="url(#shadow)" stroke="#1E3A5A" stroke-width="1" />
    
    <text x="30" y="50" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Expérience Étudiant</text>
    
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="380" height="100" fill="url(#card-grad)" rx="12" />
      <circle cx="25" cy="25" r="20" fill="#00D4FF" opacity="0.2" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#00D4FF" text-anchor="middle">📅</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Emploi du temps par semestre</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8899AA">Modules regroupés par semestre (S1-S6)</text>
    </g>
    
    <g transform="translate(30, 200)">
      <rect x="0" y="0" width="380" height="100" fill="url(#card-grad)" rx="12" />
      <circle cx="25" cy="25" r="20" fill="#00D4FF" opacity="0.2" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#00D4FF" text-anchor="middle">📱</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Scanner un QR Code</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8899AA">Validez votre présence en flashant le QR</text>
    </g>
    
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="380" height="100" fill="url(#card-grad)" rx="12" />
      <circle cx="25" cy="25" r="20" fill="#00D4FF" opacity="0.2" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#00D4FF" text-anchor="middle">📊</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Suivre ses présences</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8899AA">Consultez l'historique de vos présences</text>
    </g>
    
    <g transform="translate(30, 420)">
      <rect x="0" y="0" width="380" height="100" fill="url(#card-grad)" rx="12" />
      <circle cx="25" cy="25" r="20" fill="#00D4FF" opacity="0.2" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#00D4FF" text-anchor="middle">🔒</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Géofence 50m</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8899AA">Présence validée uniquement à proximité</text>
    </g>
    
    <rect x="30" y="550" width="380" height="100" fill="#F28C28" opacity="0.1" rx="16" stroke="#F28C28" stroke-width="1" />
    <text x="45" y="580" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#F28C28">💡 Note</text>
    <text x="45" y="600" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">Les captures ci-dessus sont des illustrations conceptuelles</td>
    <text x="45" y="618" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B0C0D0">basées sur les templates Flutter du projet.</td>
  </g>
</svg>
