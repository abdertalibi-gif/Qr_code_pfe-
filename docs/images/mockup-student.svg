<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141414;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5121B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1400" height="800" fill="url(#bg-grad)" />
  
  <!-- Mobile 1: Student Dashboard -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="360" height="680" fill="#0A0A0A" rx="36" />
    <rect x="0" y="0" width="360" height="50" fill="#0A0A0A" rx="36 36 0 0" />
    <rect x="150" y="8" width="60" height="8" fill="#FFFFFF" rx="4" />
    
    <rect x="20" y="70" width="320" height="60" fill="#141414" rx="16" stroke="#2A2A2A" stroke-width="1" />
    <text x="40" y="105" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">My Schedule</text>
    
    <!-- Semester groups -->
    <text x="40" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#DC143C">S2 · Digitalization</text>
    <rect x="40" y="170" width="150" height="80" fill="#141414" rx="12" stroke="#2A2A2A" stroke-width="1" />
    <text x="55" y="210" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Digitalization</text>
    <text x="55" y="228" font-family="'Segoe UI', sans-serif" font-size="11" fill="#DC143C" text-anchor="middle">Next session · 14:00</text>
    
    <text x="210" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#DC143C">S3 · Web Programming 1</text>
    <rect x="210" y="170" width="150" height="80" fill="#141414" rx="12" stroke="#2A2A2A" stroke-width="1" />
    <text x="225" y="210" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Web Programming 1</text>
    <text x="225" y="228" font-family="'Segoe UI', sans-serif" font-size="11" fill="#DC143C" text-anchor="middle">Next session · 16:00</text>
    
    <!-- Upcoming -->
    <text x="40" y="280" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Upcoming Sessions</text>
    <rect x="40" y="295" width="280" height="60" fill="#0A0A0A" rx="12" stroke="#B5121B" stroke-width="1.5" />
    <circle cx="70" cy="325" r="20" fill="#DC143C" opacity="0.2" />
    <text x="70" y="331" font-family="'Segoe UI', sans-serif" font-size="16" fill="#DC143C" text-anchor="middle">QR</text>
    <text x="100" y="315" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Mathematics S1</text>
    <text x="100" y="335" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Dr. Martin • Block 2 - Room 4 • 14:00-16:00</text>
    <rect x="250" y="310" width="50" height="24" fill="#DC143C" rx="12" />
    <text x="275" y="326" font-family="'Segoe UI', sans-serif" font-size="10" fill="#0D0D0D" font-weight="800" text-anchor="middle">Ready</text>
    
    <!-- QR Scanner -->
    <rect x="40" y="380" width="280" height="220" fill="#141414" rx="20" stroke="#2A2A2A" stroke-width="1" />
    <text x="60" y="410" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Scan QR Code</text>
    <rect x="60" y="430" width="240" height="240" fill="#0A0A0A" rx="16" />
    <circle cx="180" cy="550" r="80" fill="#DC143C" opacity="0.1" stroke="#DC143C" stroke-width="2" />
    <circle cx="180" cy="550" r="40" fill="#DC143C" opacity="0.3" />
    <path d="M180 510 L180 590 M140 550 L220 550" fill="none" stroke="#DC143C" stroke-width="3" stroke-linecap="round" />
    <text x="180" y="640" font-family="'Segoe UI', sans-serif" font-size="12" fill="#DC143C" text-anchor="middle">Position QR code in frame</text>
    <rect x="60" y="660" width="240" height="50" fill="url(#red-grad)" rx="12" />
    <text x="180" y="680" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#0D0D0D" text-anchor="middle">Scan</text>
  </g>
  
  <!-- Mobile 2: Attendance Confirmed -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="360" height="680" fill="#0A0A0A" rx="36" />
    <rect x="0" y="0" width="360" height="50" fill="#0A0A0A" rx="36 36 0 0" />
    <rect x="150" y="8" width="60" height="8" fill="#FFFFFF" rx="4" />
    
    <rect x="20" y="70" width="320" height="60" fill="#141414" rx="16" stroke="#2A2A2A" stroke-width="1" />
    <text x="40" y="105" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Attendance Validated ✓</text>
    
    <rect x="40" y="150" width="280" height="180" fill="#DC143C" opacity="0.1" rx="20" stroke="#DC143C" stroke-width="1" />
    <circle cx="180" cy="200" r="50" fill="#DC143C" opacity="0.2" />
    <text x="180" y="208" font-family="'Segoe UI', sans-serif" font-size="48" fill="#DC143C" text-anchor="middle">✓</text>
    <text x="180" y="265" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#DC143C" text-anchor="middle">Attendance Recorded</text>
    <text x="180" y="290" font-family="'Segoe UI', sans-serif" font-size="13" fill="#E0E0E0" text-anchor="middle">Mathematics S1 • Dr. Martin</text>
    <text x="180" y="310" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">Block 2 - Room 4 • Nov 7, 2026 • 14:15</text>
    
    <text x="40" y="360" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Session Details</text>
    <rect x="40" y="375" width="280" height="60" fill="#0A0A0A" rx="12" />
    <text x="60" y="397" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Location</text>
    <text x="60" y="415" font-family="'Segoe UI', sans-serif" font-size="13" fill="#E0E0E0">Block 2 – Room 4</text>
    <rect x="40" y="445" width="280" height="60" fill="#0A0A0A" rx="12" />
    <text x="60" y="467" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Type</text>
    <text x="60" y="485" font-family="'Segoe UI', sans-serif" font-size="13" fill="#E0E0E0">Lecture</text>
    
    <rect x="40" y="520" width="280" height="56" fill="url(#red-grad)" rx="14" />
    <text x="180" y="546" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#0D0D0D" text-anchor="middle">Back to Schedule</text>
  </g>
  
  <!-- Info panel -->
  <g transform="translate(900, 60)">
    <rect x="0" y="0" width="440" height="680" fill="#0A0A0A" rx="24" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    
    <text x="30" y="50" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Student Experience</text>
    
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="380" height="100" fill="url(#card-grad)" rx="14" />
      <circle cx="25" cy="25" r="20" fill="url(#red-grad)" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="800">📅</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Schedule by Semester</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Modules grouped by semester (S1-S6)</text>
    </g>
    
    <g transform="translate(30, 200)">
      <rect x="0" y="0" width="380" height="100" fill="url(#card-grad)" rx="14" />
      <circle cx="25" cy="25" r="20" fill="url(#red-grad)" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="800">📱</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Scan QR Code</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Validate attendance by scanning QR</text>
    </g>
    
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="380" height="100" fill="url(#card-grad)" rx="14" />
      <circle cx="25" cy="25" r="20" fill="url(#red-grad)" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="800">📊</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Track Attendance</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">View your attendance history</text>
    </g>
    
    <g transform="translate(30, 420)">
      <rect x="0" y="0" width="380" height="100" fill="url(#card-grad)" rx="14" />
      <circle cx="25" cy="25" r="20" fill="url(#red-grad)" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="800">🔒</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Geofence 50m</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Attendance validated only near location</text>
    </g>
    
    <rect x="30" y="550" width="380" height="100" fill="#DC143C" opacity="0.1" rx="16" stroke="#DC143C" stroke-width="1" />
    <text x="45" y="580" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#DC143C">💡 Note</text>
    <text x="45" y="600" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">Illustrations are concept representations</text>
    <text x="45" y="618" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">based on the project's Flutter screens.</text>
  </g>
</svg>
