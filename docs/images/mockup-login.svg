<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="login-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141414;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5121B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="900" height="700" fill="url(#login-bg)" />
  
  <circle cx="100" cy="100" r="90" fill="#DC143C" opacity="0.08" />
  <circle cx="800" cy="600" r="110" fill="#B5121B" opacity="0.08" />
  
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="300" height="540" fill="url(#card-grad)" rx="24" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="46" height="46" fill="url(#red-grad)" rx="14" />
      <text x="23" y="32" font-family="'Segoe UI', sans-serif" font-size="22" fill="#0D0D0D" text-anchor="middle" font-weight="800">📋</text>
      <text x="78" y="38" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">AttendQR</text>
      <text x="78" y="64" font-family="'Segoe UI', sans-serif" font-size="13" fill="#DC143C" font-weight="700" letter-spacing="1">QR Attendance</text>
    </g>
    
    <text x="30" y="130" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Welcome back</text>
    <text x="30" y="155" font-family="'Segoe UI', sans-serif" font-size="13" fill="#888888">Sign in to your attendance portal</text>
    
    <g transform="translate(30, 190)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#DC143C">Email address</text>
      <rect x="0" y="15" width="240" height="48" fill="#0A0A0A" rx="10" stroke="#B5121B" stroke-width="1.5" />
      <text x="12" y="50" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0B0B0">you@example.com</text>
      
      <text x="0" y="85" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#DC143C">Password</text>
      <rect x="0" y="100" width="240" height="48" fill="#0A0A0A" rx="10" stroke="#B5121B" stroke-width="1.5" />
      <text x="12" y="135" font-family="'Segoe UI', sans-serif" font-size="13" fill="#B0B0B0">••••••••</text>
      
      <text x="180" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#DC143C" text-anchor="end">Forgot password?</text>
      
      <rect x="0" y="185" width="240" height="52" fill="url(#red-grad)" rx="14" />
      <text x="120" y="215" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0D0D0D" text-anchor="middle">Sign in</text>
    </g>
    
    <g transform="translate(30, 470)">
      <line x1="0" y1="0" x2="240" y2="0" stroke="#2A2A2A" stroke-width="1" opacity="0.4" />
      <text x="0" y="25" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666666" text-anchor="middle">Secure connection · JWT</text>
      <text x="0" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666666" text-anchor="middle">← Back to home</text>
    </g>
  </g>
  
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="230" height="540" fill="url(#card-grad)" rx="24" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    
    <text x="30" y="50" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">How it works</text>
    
    <g transform="translate(30, 90)">
      <circle cx="18" cy="22" r="16" fill="url(#red-grad)" />
      <text x="18" y="28" font-family="'Segoe UI', sans-serif" font-size="14" fill="#0D0D0D" text-anchor="middle" font-weight="800">1</text>
      <text x="44" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Sign in</text>
      <text x="44" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Use your institutional credentials</text>
    </g>
    
    <g transform="translate(30, 150)">
      <circle cx="18" cy="22" r="16" fill="url(#red-grad)" />
      <text x="18" y="28" font-family="'Segoe UI', sans-serif" font-size="14" fill="#0D0D0D" text-anchor="middle" font-weight="800">2</text>
      <text x="44" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Open your dashboard</text>
      <text x="44" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Manage classes, students, sessions</text>
    </g>
    
    <g transform="translate(30, 210)">
      <circle cx="18" cy="22" r="16" fill="url(#red-grad)" />
      <text x="18" y="28" font-family="'Segoe UI', sans-serif" font-size="14" fill="#0D0D0D" text-anchor="middle" font-weight="800">3</text>
      <text x="44" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Generate QR Code</text>
      <text x="44" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Create a session and display the QR</text>
    </g>
    
    <line x1="30" y1="280" x2="200" y2="280" stroke="#2A2A2A" stroke-width="1" opacity="0.4" />
    
    <text x="30" y="310" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Roles</text>
    <text x="30" y="335" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">🎓 Administrator</text>
    <text x="30" y="355" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">👨‍🏫 Teacher</text>
    <text x="30" y="375" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">📱 Student</text>
  </g>
</svg>
