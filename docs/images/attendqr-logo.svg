<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="logo-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B5121B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5121B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Deep black background circle -->
  <circle cx="400" cy="400" r="380" fill="#0D0D0D" />
  
  <!-- Red outer ring -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="url(#red-grad)" stroke-width="8" />
  
  <!-- Inner accent ring -->
  <circle cx="400" cy="400" r="330" fill="none" stroke="#B5121B" stroke-width="2" opacity="0.4" />
  
  <!-- QR Code pattern - Red on Black -->
  <g fill="#FFFFFF">
    <!-- Position detection patterns -->
    <rect x="120" y="120" width="160" height="160" rx="6" />
    <rect x="150" y="150" width="100" height="100" fill="#0D0D0D" />
    <rect x="180" y="180" width="40" height="40" fill="#FFFFFF" />
    
    <rect x="520" y="120" width="160" height="160" rx="6" />
    <rect x="550" y="150" width="100" height="100" fill="#0D0D0D" />
    <rect x="580" y="180" width="40" height="40" fill="#FFFFFF" />
    
    <rect x="120" y="520" width="160" height="160" rx="6" />
    <rect x="150" y="550" width="100" height="100" fill="#0D0D0D" />
    <rect x="180" y="580" width="40" height="40" fill="#FFFFFF" />
  </g>
  
  <!-- Data modules -->
  <g fill="#DC143C" opacity="0.9">
    <rect x="320" y="320" width="28" height="28" />
    <rect x="360" y="320" width="28" height="28" opacity="0.6" />
    <rect x="400" y="320" width="28" height="28" />
    <rect x="320" y="360" width="28" height="28" opacity="0.6" />
    <rect x="360" y="360" width="28" height="28" />
    <rect x="400" y="360" width="28" height="28" opacity="0.6" />
    <rect x="320" y="400" width="28" height="28" />
    <rect x="360" y="400" width="28" height="28" opacity="0.6" />
    <rect x="400" y="400" width="28" height="28" />
    
    <rect x="440" y="320" width="28" height="28" opacity="0.6" />
    <rect x="480" y="320" width="28" height="28" />
    <rect x="520" y="320" width="28" height="28" opacity="0.6" />
    <rect x="440" y="360" width="28" height="28" />
    <rect x="480" y="360" width="28" height="28" opacity="0.6" />
    <rect x="520" y="360" width="28" height="28" />
    <rect x="440" y="400" width="28" height="28" opacity="0.6" />
    <rect x="480" y="400" width="28" height="28" />
    <rect x="520" y="400" width="28" height="28" opacity="0.6" />
  </g>
  
  <!-- Bold red checkmark -->
  <path d="M340 440 L390 490 L500 380" fill="none" stroke="#DC143C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Decorative red dots -->
  <g fill="#DC143C" opacity="0.15">
    <circle cx="160" cy="680" r="8" />
    <circle cx="660" cy="160" r="6" />
    <circle cx="700" cy="700" r="7" />
    <circle cx="130" cy="130" r="5" />
  </g>
  
  <!-- "A" monogram negative space -->
  <path d="M300 200 L400 120 L500 200 M400 120 L400 340" fill="none" stroke="#DC143C" stroke-width="6" stroke-linecap="round" opacity="0.3" />
</svg>
