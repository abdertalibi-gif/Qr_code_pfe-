<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D2B45;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F7DB8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="400" cy="400" r="360" fill="url(#grad1)" />
  
  <!-- Outer ring -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="url(#grad2)" stroke-width="4" opacity="0.8" />
  
  <!-- QR Code pattern -->
  <g id="qr-code">
    <!-- Position detection patterns (3 corners) -->
    <g fill="#FFFFFF">
      <!-- Top-left -->
      <rect x="110" y="110" width="140" height="140" rx="4" />
      <rect x="140" y="140" width="80" height="80" fill="#0A192F" />
      <rect x="170" y="170" width="20" height="20" fill="#FFFFFF" />
      
      <!-- Top-right -->
      <rect x="550" y="110" width="140" height="140" rx="4" />
      <rect x="580" y="140" width="80" height="80" fill="#0A192F" />
      <rect x="610" y="170" width="20" height="20" fill="#FFFFFF" />
      
      <!-- Bottom-left -->
      <rect x="110" y="550" width="140" height="140" rx="4" />
      <rect x="140" y="580" width="80" height="80" fill="#0A192F" />
      <rect x="170" y="610" width="20" height="20" fill="#FFFFFF" />
    </g>
    
    <!-- Data modules -->
    <g fill="#FFFFFF" opacity="0.9">
      <rect x="310" y="310" width="24" height="24" />
      <rect x="346" y="310" width="24" height="24" opacity="0.7" />
      <rect x="382" y="310" width="24" height="24" />
      <rect x="310" y="346" width="24" height="24" opacity="0.7" />
      <rect x="346" y="346" width="24" height="24" />
      <rect x="382" y="346" width="24" height="24" opacity="0.7" />
      <rect x="310" y="382" width="24" height="24" />
      <rect x="346" y="382" width="24" height="24" opacity="0.7" />
      <rect x="382" y="382" width="24" height="24" />
      
      <rect x="440" y="310" width="24" height="24" opacity="0.7" />
      <rect x="476" y="310" width="24" height="24" />
      <rect x="512" y="310" width="24" height="24" opacity="0.7" />
      <rect x="440" y="346" width="24" height="24" />
      <rect x="476" y="346" width="24" height="24" opacity="0.7" />
      <rect x="512" y="346" width="24" height="24" />
      <rect x="440" y="382" width="24" height="24" opacity="0.7" />
      <rect x="476" y="382" width="24" height="24" />
      <rect x="512" y="382" width="24" height="24" opacity="0.7" />
    </g>
  </g>
  
  <!-- Checkmark overlay -->
  <path d="M320 420 L360 460 L460 360" fill="none" stroke="url(#grad2)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Subtle decorative dots -->
  <g fill="#00D4FF" opacity="0.15">
    <circle cx="150" cy="650" r="6" />
    <circle cx="650" cy="150" r="4" />
    <circle cx="680" cy="680" r="5" />
    <circle cx="120" cy="120" r="3" />
  </g>
</svg>
