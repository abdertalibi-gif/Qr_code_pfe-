<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141414;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5121B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1400" height="800" fill="url(#bg-grad)" />
  
  <!-- Mobile frame -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="380" height="700" fill="#0A0A0A" rx="40" />
    <rect x="0" y="0" width="380" height="50" fill="#0A0A0A" rx="40 40 0 0" />
    <rect x="165" y="8" width="50" height="8" fill="#FFFFFF" rx="4" />
    
    <!-- Header -->
    <rect x="20" y="70" width="340" height="60" fill="#141414" rx="16" stroke="#2A2A2A" stroke-width="1" />
    <text x="40" y="105" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">New Session</text>
    <rect x="315" y="82" width="28" height="28" fill="#DC143C" rx="8" />
    <text x="329" y="102" font-family="'Segoe UI', sans-serif" font-size="16" fill="#0D0D0D" text-anchor="middle" font-weight="800">✕</text>
    
    <!-- Class -->
    <text x="40" y="160" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#DC143C">Class</text>
    <rect x="40" y="175" width="300" height="52" fill="#0A0A0A" rx="12" stroke="#B5121B" stroke-width="1.5" />
    <text x="55" y="205" font-family="'Segoe UI', sans-serif" font-size="14" fill="#E0E0E0">License S1 – Digitalization</text>
    
    <!-- Location -->
    <text x="40" y="240" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#DC143C">Session Location</text>
    <rect x="40" y="255" width="300" height="72" fill="#0A0A0A" rx="12" stroke="#B5121B" stroke-width="1.5" />
    <text x="55" y="278" font-family="'Segoe UI', sans-serif" font-size="13" fill="#DC143C" font-weight="700">Block 2 – Room 4</text>
    <text x="55" y="298" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Pre-filled from class · Editable</text>
    
    <!-- Session type -->
    <text x="40" y="340" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#DC143C">Session Type</text>
    <rect x="40" y="355" width="300" height="52" fill="#0A0A0A" rx="12" stroke="#B5121B" stroke-width="1.5" />
    <text x="55" y="385" font-family="'Segoe UI', sans-serif" font-size="14" fill="#E0E0E0">Lecture ▼</text>
    
    <!-- Date -->
    <text x="40" y="420" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#DC143C">Date &amp; Time</text>
    <rect x="40" y="435" width="300" height="52" fill="#0A0A0A" rx="12" stroke="#B5121B" stroke-width="1.5" />
    <text x="55" y="465" font-family="'Segoe UI', sans-serif" font-size="14" fill="#E0E0E0">Nov 7, 2026 · 14:00 – 16:00</text>
    
    <!-- Location type -->
    <text x="40" y="510" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#DC143C">Location Type</text>
    <rect x="40" y="525" width="300" height="44" fill="#0A0A0A" rx="12" stroke="#B5121B" stroke-width="1.5" />
    <text x="55" y="553" font-family="'Segoe UI', sans-serif" font-size="13" fill="#E0E0E0">Block + Room ▼</text>
    
    <!-- Availability -->
    <rect x="40" y="590" width="300" height="44" fill="#DC143C" opacity="0.1" rx="12" stroke="#DC143C" stroke-width="1" />
    <text x="55" y="616" font-family="'Segoe UI', sans-serif" font-size="12" fill="#DC143C">✓ 3 rooms and 1 amphitheaters available</text>
    
    <!-- Submit -->
    <rect x="40" y="660" width="300" height="56" fill="url(#red-grad)" rx="18" />
    <text x="190" y="694" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0D0D0D" text-anchor="middle">Create Session</text>
  </g>
  
  <!-- Info panel -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="400" height="700" fill="#0A0A0A" rx="24" filter="url(#shadow)" stroke="#B5121B" stroke-width="1" />
    
    <text x="30" y="50" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Teacher Features</text>
    
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="340" height="100" fill="url(#card-grad)" rx="14" />
      <circle cx="25" cy="25" r="20" fill="url(#red-grad)" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="800">📋</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Create Session</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Select class, set date/time</text>
    </g>
    
    <g transform="translate(30, 210)">
      <rect x="0" y="0" width="340" height="100" fill="url(#card-grad)" rx="14" />
      <circle cx="25" cy="25" r="20" fill="url(#red-grad)" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="800">📱</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Show QR Code</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Generate QR to display to students</text>
    </g>
    
    <g transform="translate(30, 330)">
      <rect x="0" y="0" width="340" height="100" fill="url(#card-grad)" rx="14" />
      <circle cx="25" cy="25" r="20" fill="url(#red-grad)" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="800">📊</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">View Attendance</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Check real-time attendance rates</text>
    </g>
    
    <g transform="translate(30, 450)">
      <rect x="0" y="0" width="340" height="100" fill="url(#card-grad)" rx="14" />
      <circle cx="25" cy="25" r="20" fill="url(#red-grad)" />
      <text x="25" y="31" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="800">📄</text>
      <text x="55" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Export Reports</text>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">Download Excel reports per session</text>
    </g>
    
    <!-- Editable note -->
    <rect x="30" y="580" width="340" height="120" fill="#DC143C" opacity="0.1" rx="16" stroke="#DC143C" stroke-width="1" />
    <text x="45" y="610" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#DC143C">💡 Editable Location</text>
    <text x="45" y="630" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">Class location is proposed automatically</text>
    <text x="45" y="648" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">but the teacher can modify it per session.</text>
    <text x="45" y="666" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E0E0E0">Original class config is preserved.</text>
  </g>
</svg>
