{% extends "admin_base.html" %}
{% block content %}
<div style="padding:2rem">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
    <div>
      <h1 style="font-size:1.4rem;font-weight:700">✉️ Messages de contact</h1>
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-top:0.3rem">Gérez les messages envoyés depuis la page d'accueil</p>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <input type="text" id="searchInput" placeholder="Rechercher par nom, email, sujet..." onkeyup="if(event.key==='Enter')cm.loadMessages()" style="padding:0.45rem 0.8rem;border:1.5px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:0.85rem;width:260px">
      <select id="filterStatus" onchange="cm.loadMessages()" style="padding:0.45rem 0.8rem;border:1.5px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:0.85rem">
        <option value="all">Tous</option>
        <option value="Nouveau">Nouveau</option>
        <option value="Lu">Lu</option>
        <option value="Traité">Traité</option>
      </select>
    </div>
  </div>

  <div id="messagesStats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem"></div>

  <div id="messagesContainer">
    <table class="data-table" style="width:100%">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Email</th>
          <th>Sujet</th>
          <th>Date</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="messagesTableBody">
        <tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--text-secondary)">Chargement...</td></tr>
      </tbody>
    </table>
    <div id="messagesPagination" style="display:flex;justify-content:center;gap:0.5rem;margin-top:1rem"></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal" style="display:none">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <h3>Détail du message</h3>
      <button class="modal-close" onclick="cm.closeDetail()">&times;</button>
    </div>
    <div class="modal-body" id="detailBody" style="padding:1.5rem;line-height:1.7;font-size:0.9rem">
    </div>
    <div class="modal-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;padding:1rem 1.5rem;border-top:1px solid var(--border)">
      <button class="btn btn-outline" onclick="cm.closeDetail()">Fermer</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal" style="display:none">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3>Confirmer la suppression</h3>
      <button class="modal-close" onclick="cm.closeDelete()">&times;</button>
    </div>
    <div class="modal-body" style="padding:1.5rem">
      <p>Êtes-vous sûr de vouloir supprimer ce message ?</p>
    </div>
    <div class="modal-footer" style="display:flex;gap:0.75rem;justify-content:flex-end;padding:1rem 1.5rem;border-top:1px solid var(--border)">
      <button class="btn btn-outline" onclick="cm.closeDelete()">Annuler</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">Supprimer</button>
    </div>
  </div>
</div>

<script src="/admin-contact-messages.js"></script>
{% endblock %}
