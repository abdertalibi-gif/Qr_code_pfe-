<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PresenceQR — Nouveau mot de passe</title>
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body class="login-page">
  <aside class="login-brand-panel">
    <div class="deco-circle"></div>
    <div class="login-brand-content">
      <div class="nav-brand" style="color:#fff">
        <div class="nav-brand-icon">📋</div>
        <span style="font-size:1.15rem;font-weight:800">PresenceQR</span>
      </div>
      <h2>Nouveau mot de passe</h2>
      <p>Choisissez un mot de passe securise pour votre compte.</p>
    </div>
    <p class="login-brand-footer">&copy; 2026 PresenceQR</p>
  </aside>

  <div class="login-form-panel">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:0.25rem">
        <div style="width:48px;height:48px;background:linear-gradient(135deg,#0F7DB8,#2196D3);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;box-shadow:0 4px 12px rgba(15,125,184,0.3);margin-bottom:1rem">📋</div>
      </div>
      <h1 style="text-align:center">Reinitialisation</h1>
      <p class="subtitle" style="text-align:center" id="statusMsg">Saisissez votre nouveau mot de passe.</p>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">Nouveau mot de passe</label>
          <input type="password" id="newPassword" placeholder="Au moins 8 caracteres" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input type="password" id="confirmPassword" placeholder="Confirmer" minlength="8" required />
        </div>

        <button type="submit" class="btn" id="resetConfirmBtn">
          <span class="btn-label">Reinitialiser</span>
          <span class="spinner"></span>
        </button>

        <div class="alert" id="alert"></div>
      </form>

      <p style="margin-top:1.75rem;text-align:center;font-size:.82rem">
        <a href="/login/" style="color:var(--primary);text-decoration:none">← Retour a la connexion</a>
      </p>
    </div>
  </div>

  <script src="/api.js"></script>
  <script>
    var uidb64 = '{{ uidb64 }}';
    var token = '{{ token }}';
    var isValid = {{ valid|yesno:"true,false" }};

    var form = document.getElementById('resetForm');
    var btn = document.getElementById('resetConfirmBtn');
    var alertEl = document.getElementById('alert');
    var statusMsg = document.getElementById('statusMsg');

    function showAlert(msg, type) {
      alertEl.className = 'alert ' + (type || 'error');
      alertEl.innerHTML = '<span>' + (type === 'success' ? '&#9989;' : '&#9888;&#65039;') + '</span><span>' + msg + '</span>';
    }

    function setLoading(loading) {
      btn.disabled = loading;
      btn.classList.toggle('loading', loading);
    }

    if (!isValid) {
      statusMsg.textContent = 'Ce lien est invalide ou a expire.';
      form.innerHTML = '<p style="color:var(--red);margin-top:1rem">Veuillez demander un nouveau lien de reinitialisation.</p>' +
        '<p style="margin-top:1rem"><a href="/login/" class="btn" style="text-decoration:none;display:inline-block">Aller a la connexion</a></p>';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      alertEl.className = 'alert';

      var pwd = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;

      if (pwd.length < 8) {
        showAlert('Le mot de passe doit contenir au moins 8 caracteres.');
        return;
      }
      if (pwd !== confirm) {
        showAlert('Les mots de passe ne correspondent pas.');
        return;
      }

      setLoading(true);
      try {
        var res = await fetch(API_BASE + '/auth/password-reset/confirm/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uidb64: uidb64, token: token, new_password: pwd }),
        });
        var data = await res.json();
        if (res.ok) {
          showAlert('Mot de passe reinitialise avec succes !', 'success');
          statusMsg.textContent = 'Vous pouvez maintenant vous connecter.';
          document.querySelector('#resetForm button').style.display = 'none';
          document.getElementById('newPassword').disabled = true;
          document.getElementById('confirmPassword').disabled = true;
          setTimeout(function () { window.location.href = '/login/'; }, 3000);
        } else {
          showAlert(data.detail || 'Erreur lors de la reinitialisation.');
        }
      } catch (err) {
        showAlert('Erreur reseau. Veuillez reessayer.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
