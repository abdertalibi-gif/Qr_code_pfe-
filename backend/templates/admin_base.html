<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrésenceQR — Administration</title>
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body class="dashboard-app">
<!-- NAV -->
<nav>
  <div class="nav-brand">
    <div class="nav-brand-icon">📋</div>
    <span>PrésenceQR</span>
  </div>
  <div class="nav-links" id="navLinks">
    <a href="/admin/attendance-live/" class="nav-link" data-page="attendance-live">📡 Présences en direct</a>
    <a href="/admin/users/" class="nav-link" data-page="users">👤 Utilisateurs</a>
    <a href="/admin/teachers/" class="nav-link" data-page="teachers">👨‍🏫 Enseignants</a>
    <a href="/admin/students/" class="nav-link" data-page="students">🎓 Étudiants</a>
    <a href="/admin/classes/" class="nav-link" data-page="classes">🏫 Classes</a>
    <a href="/admin/curriculum/" class="nav-link" data-page="curriculum">📚 Curriculum</a>
    <a href="/admin/sessions/" class="nav-link" data-page="sessions">📅 Séances</a>
    <a href="/admin/departments/" class="nav-link" data-page="departments">🏛️ Départements</a>
    <a href="/admin/filieres/" class="nav-link" data-page="filieres">🏢 Filières</a>
    <a href="/admin/rooms/" class="nav-link" data-page="rooms">🚪 Salles</a>
    <a href="/admin/reports/" class="nav-link" data-page="reports">📊 Rapports</a>
    <a href="/admin/statistics/" class="nav-link" data-page="statistics">📈 Statistiques</a>
    <a href="/admin/settings/" class="nav-link" data-page="settings">⚙️ Paramètres</a>
  </div>
  <div class="nav-right">
    <div class="user-pill">
      <div class="user-avatar" id="avatarInitials">?</div>
      <span id="navUserName">Chargement…</span>
      <span class="badge" id="navRoleBadge">Administrateur</span>
    </div>
    <button class="btn-icon" onclick="API.logout()" title="Déconnexion">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Déconnexion
    </button>
  </div>
</nav>

<!-- MAIN -->
<main>
</main>

<!-- TOAST -->
<div id="toast"></div>

<!-- COMMON SCRIPTS -->
<script src="/api.js"></script>
<script src="/admin-common.js"></script>
<script src="/i18n-fr.js"></script>
<script>
  /* ── Auth guard & nav init ── */
  let currentUser = null;

  (async () => {
    try {
      currentUser = await API.requireAuth(['admin', 'department_head', 'program_manager']);
      document.getElementById('navUserName').textContent =
        `${currentUser.first_name} ${currentUser.last_name}`;
      document.getElementById('avatarInitials').textContent =
        (currentUser.first_name?.[0] || '') + (currentUser.last_name?.[0] || '');
      updateRoleUI(currentUser);
    } catch {
      window.location.href = '/login/';
      return;
    }

    // Highlight active nav link
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.getAttribute('href') === currentPath || 
          (currentPath.startsWith('/admin/') && link.getAttribute('href') === '/admin/' + currentPath.split('/')[2] + '/')) {
        link.classList.add('active');
      }
    });

    setupModalCloseHandlers();

    if (typeof initPage === 'function') {
      await initPage();
    }
  })();

  const roleLabel = { admin: 'Admin', teacher: 'Enseignant', student: 'Étudiant', department_head: 'Chef de département', program_manager: 'Responsable de filière' };
  const roleBadgeClass = { admin: 'badge-admin', department_head: 'badge-department-head', program_manager: 'badge-program-manager', teacher: 'badge-teacher', student: 'badge-student' };

  function updateRoleUI(user) {
    const badge = document.getElementById('navRoleBadge');
    if (badge) {
      badge.textContent = roleLabel[user.role] || user.role;
      badge.className = 'badge ' + (roleBadgeClass[user.role] || '');
    }
    // Show/hide nav links based on role
    const isAdmin = user.role === 'admin';
    document.querySelectorAll('.nav-link[data-page]').forEach(link => {
      const page = link.dataset.page;
      const allowedPages = isAdmin
        ? ['attendance-live', 'users', 'teachers', 'students', 'classes', 'curriculum', 'sessions', 'departments', 'filieres', 'rooms', 'reports', 'statistics', 'settings']
        : ['attendance-live', 'sessions', 'curriculum', 'departments', 'filieres', 'rooms', 'reports', 'statistics'];
      link.style.display = allowedPages.includes(page) ? '' : 'none';
    });
  }
</script>
</body>
</html>
